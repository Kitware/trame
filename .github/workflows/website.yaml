# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Deploy VitePress site to Pages

on:
  push:
    branches: [master]

  # Runs daily at midnight
  schedule:
    - cron: '30 6 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        working-directory: docs/vitepress
        run: "pip install -r requirements.txt"
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Install dependencies
        working-directory: docs/vitepress
        run: npm ci
      - name: Update blogs
        working-directory: docs/vitepress
        run: python update_blogs.py
      - name: Cache repo images
        uses: actions/cache@v4
        with:
          path: docs/vitepress/public/repos_images
          key: repo-images-${{ github.run_id }}
          restore-keys: |
            repo-images-
      - name: Fetch trame repos
        working-directory: docs/vitepress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_repos.py
      - name: Build with VitePress
        working-directory: docs/vitepress
        run: |
          npm run docs:build
          touch .vitepress/dist/.nojekyll
          mkdir -p .vitepress/dist/trame
          cp -rf .vitepress/dist/logos .vitepress/dist/trame/logos
          cp -rf .vitepress/dist/assets .vitepress/dist/trame/assets

      - name: Cache badges
        uses: actions/cache@v4
        with:
          path: docs/vitepress/.vitepress/dist/downloads
          key: pypi-badges-${{ github.run_id }}
          restore-keys: |
            pypi-badges-
      - name: Download badges
        working-directory: docs/vitepress/.vitepress/dist
        run: |
          mkdir -p downloads
          packages="
            trame
            trame-client
            trame-server
            trame-common
            trame-vuetify
            trame-vtklocal
            trame-rca
            trame-vtk
            trame-slicer
            trame-tauri
            trame-simput
            trame-datagrid
            trame-code
            trame-matplotlib
            trame-quasar
            trame-image-tools
            trame-plotly
            trame-iframe
            trame-leaflet
            trame-vega
            trame-components
            trame-deckgl
            trame-router
            trame-markdown
            trame-dataclass
            trame-xterm
            trame-radial-menu
            trame-colormaps
            trame-dockview
          "

          tmpdir="$(mktemp -d)"

          # shields.io returns HTTP 200 even when it can't reach PyPI: it
          # silently serves this generic fallback badge instead of an error.
          fallback_md5="b8e23d6c4c939728e75a8e42f0240c85"

          for pkg in $packages; do
            f="${tmpdir}/${pkg}.svg"
            dest="./downloads/${pkg}.svg"
            curl -fsS -o "$f" "https://img.shields.io/pypi/dm/${pkg}" || true
            sleep 2

            if [ ! -s "$f" ]; then
              echo "::warning::no response fetching badge for ${pkg}, keeping previous badge"
              continue
            fi
            if [ "$(md5sum "$f" | cut -d' ' -f1)" = "$fallback_md5" ]; then
              echo "::warning::badge for ${pkg} is shields.io's fallback, keeping previous badge"
              continue
            fi
            mv "$f" "$dest"
          done

          rm -rf "$tmpdir"
      - name: Upload artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/vitepress/.vitepress/dist

  # Deployment job
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
